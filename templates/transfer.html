<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'transfer.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>


    <div class="template-page">
        <div class="template">
            <i class="bi bi-bank"></i>
            <span>Bluewhale Bank</span>
            <h6 id="secure">Secure Banking</h6>
        </div>
        <ul>
            <li>
                <a href="http://127.0.0.1:8000/features">
                    <i class="bi bi-house-door"></i>
                    HOME
                </a>
            </li>
            <li>
                <a href="http://127.0.0.1:8000/deposit">
                    <i class="bi bi-download"></i>
                    <p>Deposit</p>
                </a>
            </li>
            <li>
                <a href="http://127.0.0.1:8000/withdraw">
                    <i class="bi bi-download"></i>
                    <p>Withdraw</p>
                </a>
            </li>
            <li>
                <a href="http://127.0.0.1:8000/transfer">
                    <i class="bi bi-arrow-left-right"></i>
                    <p>Transfer</p>
                </a>
            </li>
            <li>
                <a href="http://127.0.0.1:8000/check">
                    <i class="bi bi-wallet2"></i>
                    <p>Check</p>
                </a>
            </li>
            <li>
                <a href="http://127.0.0.1:8000/viewtranscations">
                    <i class="bi bi-receipt"></i>
                    <p>Viewtranscations</p>
                </a>
            </li>
        </ul>
        <form method="post" action="{% url 'logout_here' %}">
            {% csrf_token %}
            <div class="btn">
                <button type="submit" class="bi bi-box-arrow-left" id="btn">LOGOUT</button>
            </div>
        </form>
    </div>
    
    <form action="" method="POST">

        <div class="transfer-page">
            <div class="transfer">
                <div class="icon">
                    <i class="bi bi-arrow-left-right" id="re"></i>
                </div>
                <h1>Transfer</h1>
                <p>Account Number:</p>
                <p id="account">{{account_number}}</p>
                <p>To Account:</p>
                <input id="from" type="number" placeholder="To account" name="to_account">
                <button id="find" type="search">search</button>
                {{error}}
                <div id="Holder_name"></div>
                <p>Amount:</p>
                <input id="op" type="" placeholder="Amount" name="amount">
                <div class="button">
                    <button id="trans" type="submit">Transfer</button>
                </div>
            </div>
        </div>

    </form>
    <script src="{% static 'transfer.js'  %}"></script>
</body>
</html>
