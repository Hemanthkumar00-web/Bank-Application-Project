<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>withdraw</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'withdraw.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
   <div class="template-page">
            <div class="template">
                <i class="bi bi-bank"></i>
                <span>Bluewhale Bank</span>
                <h6 id="secure">Secure Banking</h6>
            </div>
            <ul>
                <li>
                    <a href="http://127.0.0.1:8000/features">
                        <i class="bi bi-house-door"></i>
                        <p>HOME</p>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="bi bi-download"></i>
                        <p>Deposit</p>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="bi bi-download"></i>
                        <p>Withdraw</p>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="bi bi-arrow-left-right"></i>
                        <p>Transfer</p>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="bi bi-wallet2"></i>
                        <p>Check</p>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="bi bi-receipt"></i>
                        <p>Viewtranscations</p>
                    </a>
                </li>
            </ul>
            <div class="btn">
                <button type="submit" class="bi bi-box-arrow-left" id="btn">LOGOUT</button>
            </div>
        </div>
        </div>
        <form action="" method="POST">
            <div class="home">
                <div class="withdraw-page">
                    <div class="withdraw">
                        <div class="ico">
                            <i class="bi bi-download" id="download"></i>

                        </div>
                        <h1>WITHDRAW</h1>
                        Account Number:
                        <p id="color">{{account_number}}</p>
                        <p>withdraw amount:</p>
                        {{ error }}
                        <input id="depo" type="" required placeholder="Enter amount" name="amount">
                        <button id="try" type="submit">withdraw</button>
                    </div>
                </div>
            </div>
        </form>
</body>

</html>
