<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'login.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <form action="" method="POST">
        {% csrf_token %}
        <div class="bigwhale">
            <img id="ed" src="{% static 'whale.png.jpeg' %}">
                    <div class="login-page">
                        <div class="login">
                            <h1 id="detail">Log In Into Blue Whale Bank:</h1>
                            <label>Email:</label>
                            <input id="phno" type="email" placeholder="email" name="email">
                            <label>password:</label>
                            <input id="pass" type="password" placeholder="password" name="password">
                            <button id="btn" type="submit">Login</button>
                            <div class="account">
                                Does not have an account
                                <a id="href" href="http://127.0.0.1:8000/Register">?Register</a>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</body>

</html>
